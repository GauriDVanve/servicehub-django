<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ServiceHub</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Internal CSS -->
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        /* Main Section */
        .admin-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }

        /* Login Card */
        .admin-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        /* Logo */
        .brand {
            text-align: center;
            font-size: 27px;
            font-weight: 800;
            color: #0f172a;
        }

        .brand span {
            color: #e5ad00;
        }

        /* Admin Icon */
        .admin-icon {
            width: 65px;
            height: 65px;
            margin: 25px auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff4c2;
            color: #b88900;
            border-radius: 16px;
            font-size: 27px;
        }

        .admin-card h2 {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #111827;
        }

        .admin-card .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 28px;
        }

        /* Form */
        .form-label {
            font-size: 13px;
            font-weight: 700;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a94a3;
        }

        .form-control {
            min-height: 50px;
            padding-left: 43px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.15);
        }

        /* Password */
        .password-input {
            padding-right: 45px;
        }

        .password-btn {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6b7280;
        }

        /* Button */
        .login-btn {
            min-height: 50px;
            background: #ffc107;
            color: #111827;
            border: none;
            border-radius: 10px;
            font-weight: 800;
        }

        .login-btn:hover {
            background: #e8b000;
        }

        /* Message */
        .alert {
            font-size: 13px;
            border-radius: 10px;
        }

        /* Home */
        .back-home {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            text-decoration: none;
        }

        .back-home:hover {
            color: #b88900;
        }

        /* Security */
        .security-text {
            margin-top: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 11px;
        }

        .security-text i {
            color: #16a34a;
        }

        @media(max-width: 576px) {

            .admin-card {
                padding: 30px 22px;
            }

        }

    </style>

</head>

<body>


<section class="admin-section">

    <div class="admin-card">

        <!-- Brand -->
        <div class="brand">
            Service<span>Hub</span>
        </div>

        <!-- Icon -->
        <div class="admin-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <!-- Heading -->
        <h2>Admin Login</h2>

        <p class="subtitle">
            Login to manage the ServiceHub platform.
        </p>


        <!-- Django Messages -->
        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <!-- Login Form -->
        <form method="POST">

            {% csrf_token %}


            <!-- Username -->
            <div class="mb-3">

                <label class="form-label">
                    Admin Username
                </label>

                <div class="input-box">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter admin username"
                        required
                    >

                </div>

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <div class="input-box">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control password-input"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        class="password-btn"
                        onclick="showPassword()"
                    >
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>

                </div>

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="btn login-btn w-100"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login as Admin
            </button>

        </form>


        <!-- Home -->
        <a href="{% url 'home' %}" class="back-home">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Website
        </a>


        <div class="security-text">
            <i class="bi bi-shield-check me-1"></i>
            Authorized administrators only
        </div>

    </div>

</section>


<!-- Password Show / Hide -->
<script>

    function showPassword() {

        const password = document.getElementById("password");
        const icon = document.getElementById("eyeIcon");

        if (password.type === "password") {

            password.type = "text";
            icon.classList.replace("bi-eye", "bi-eye-slash");

        } else {

            password.type = "password";
            icon.classList.replace("bi-eye-slash", "bi-eye");

        }

    }

</script>


</body>
</html>
