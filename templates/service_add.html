<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Service | ServiceHub Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Internal CSS -->
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        a {
            text-decoration: none;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: #0f172a;
            padding: 25px 18px;
            z-index: 1000;
        }

        .brand {
            color: white;
            font-size: 25px;
            font-weight: 800;
            padding: 0 12px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .brand span {
            color: #ffc107;
        }

        .menu-title {
            margin: 25px 12px 10px;
            color: rgba(255,255,255,0.35);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            margin-bottom: 6px;
            color: rgba(255,255,255,0.65);
            border-radius: 9px;
            font-size: 13px;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: #ffc107;
            color: #111827;
        }

        /* Main */
        .main-content {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            min-height: 70px;
            padding: 15px 30px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h5 {
            margin: 0;
            font-weight: 800;
        }

        .admin-info {
            font-size: 13px;
            font-weight: bold;
        }

        /* Content */
        .page-content {
            padding: 35px 30px;
        }

        .back-link {
            color: #6b7280;
            font-size: 12px;
        }

        .page-title {
            margin: 15px 0 25px;
        }

        .page-title h2 {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 13px;
        }

        /* Form */
        .form-card {
            max-width: 800px;
            padding: 30px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
        }

        .required {
            color: #dc2626;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border-radius: 9px;
            font-size: 13px;
        }

        textarea.form-control {
            min-height: 130px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.15);
        }

        .help-text {
            margin-top: 6px;
            color: #9ca3af;
            font-size: 11px;
        }

        /* Status */
        .status-box {
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .form-check-input:checked {
            background-color: #ffc107;
            border-color: #ffc107;
        }

        /* Buttons */
        .save-btn {
            background: #ffc107;
            color: #111827;
            border: none;
            padding: 11px 20px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: bold;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;
            padding: 11px 20px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: bold;
        }

        /* Mobile */
        .menu-btn {
            display: none;
            border: none;
            background: #0f172a;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
        }

        @media(max-width: 991px) {

            .sidebar {
                left: -250px;
                transition: 0.3s;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .menu-btn {
                display: inline-block;
            }

        }

        @media(max-width: 576px) {

            .topbar {
                padding: 15px;
            }

            .page-content {
                padding: 25px 15px;
            }

            .form-card {
                padding: 22px 18px;
            }

        }

    </style>

</head>

<body>


<!-- Sidebar -->
<div class="sidebar" id="sidebar">

    <div class="brand">
        Service<span>Hub</span>
    </div>

    <div class="menu-title">
        ADMIN PANEL
    </div>

    <a href="{% url 'admin_dashboard' %}" class="sidebar-link">
        <i class="bi bi-grid"></i>
        Dashboard
    </a>

    <a href="{% url 'category_list' %}" class="sidebar-link">
        <i class="bi bi-tags"></i>
        Categories
    </a>

    <a href="{% url 'service_list' %}" class="sidebar-link active">
        <i class="bi bi-briefcase"></i>
        Services
    </a>

    <a href="#" class="sidebar-link">
        <i class="bi bi-people"></i>
        Users
    </a>

    <a href="#" class="sidebar-link">
        <i class="bi bi-calendar-check"></i>
        Bookings
    </a>

    <a href="#" class="sidebar-link">
        <i class="bi bi-star"></i>
        Reviews
    </a>

    <div class="menu-title">
        ACCOUNT
    </div>

    <a href="{% url 'home' %}" class="sidebar-link">
        <i class="bi bi-globe"></i>
        View Website
    </a>

    <a href="{% url 'logout' %}" class="sidebar-link">
        <i class="bi bi-box-arrow-right"></i>
        Logout
    </a>

</div>


<!-- Main -->
<div class="main-content">


    <!-- Topbar -->
    <div class="topbar">

        <div class="d-flex align-items-center gap-3">

            <button class="menu-btn" onclick="toggleSidebar()">
                <i class="bi bi-list"></i>
            </button>

            <h5>Add Service</h5>

        </div>

        <div class="admin-info">
            <i class="bi bi-person-circle me-1"></i>
            {{ user.username }}
        </div>

    </div>


    <!-- Content -->
    <div class="page-content">

        <a href="{% url 'service_list' %}" class="back-link">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Services
        </a>


        <div class="page-title">

            <h2>Add New Service</h2>

            <p>
                Add a new service to the ServiceHub platform.
            </p>

        </div>


        <!-- Form -->
        <div class="form-card">

            <form method="POST">

                {% csrf_token %}


                <!-- Category -->
                <div class="mb-4">

                    <label class="form-label">
                        Category
                        <span class="required">*</span>
                    </label>

                    <select name="category" class="form-select" required>

                        <option value="">
                            Select Category
                        </option>

                        {% for category in categories %}

                            <option value="{{ category.id }}">
                                {{ category.name }}
                            </option>

                        {% endfor %}

                    </select>

                    <div class="help-text">
                        Select the service category.
                    </div>

                </div>


                <!-- Service Name -->
                <div class="mb-4">

                    <label class="form-label">
                        Service Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Example: Wedding Photography"
                        required
                    >

                </div>


                <!-- Description -->
                <div class="mb-4">

                    <label class="form-label">
                        Description
                        <span class="required">*</span>
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        placeholder="Enter service description"
                        required
                    ></textarea>

                </div>


                <!-- Price -->
                <div class="mb-4">

                    <label class="form-label">
                        Price
                        <span class="required">*</span>
                    </label>

                    <input
                        type="number"
                        name="price"
                        class="form-control"
                        placeholder="Example: 5000"
                        min="0"
                        step="0.01"
                        required
                    >

                    <div class="help-text">
                        Enter service price in ₹.
                    </div>

                </div>


                <!-- Status -->
                <div class="mb-4">

                    <label class="form-label">
                        Service Status
                    </label>

                    <div class="status-box">

                        <div class="form-check form-switch">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_active"
                                id="isActive"
                                checked
                            >

                            <label class="form-check-label" for="isActive">
                                Active Service
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button type="submit" class="save-btn">
                        <i class="bi bi-check-lg me-1"></i>
                        Save Service
                    </button>

                    <a href="{% url 'service_list' %}" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<script>

    // Mobile sidebar
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("show");
    }

</script>


</body>
</html>
